<svg width="100%" height="100%" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
        </linearGradient>
        <style>
            .line { stroke: #e0e0e0; stroke-width: 1; }
            .dot { fill: #2ecc71; }
        </style>
    </defs>
    
    <!-- Abstract background grid -->
    <g opacity="0.3">
        <line class="line" x1="0" y1="50" x2="400" y2="50" />
        <line class="line" x1="0" y1="100" x2="400" y2="100" />
        <line class="line" x1="0" y1="150" x2="400" y2="150" />
        <line class="line" x1="100" y1="0" x2="100" y2="200" />
        <line class="line" x1="200" y1="0" x2="200" y2="200" />
        <line class="line" x1="300" y1="0" x2="300" y2="200" />
    </g>

    <!-- Central shape -->
    <path d="M 50,150 C 100,50 250,50 350,150 Z" fill="url(#grad1)" opacity="0.1" />
    
    <!-- Network lines -->
    <g stroke-width="2" stroke="url(#grad1)">
        <path fill="none" d="M 80,120 Q 150,80 200,110 T 320,100" />
        <path fill="none" d="M 90,140 Q 180,150 250,120 T 340,130" />
    </g>

    <!-- Network dots -->
    <circle class="dot" cx="80" cy="120" r="4" />
    <circle class="dot" cx="200" cy="110" r="4" />
    <circle class="dot" cx="320" cy="100" r="4" />
    <circle class="dot" cx="90" cy="140" r="4" />
    <circle class="dot" cx="250" cy="120" r="4" />
    <circle class="dot" cx="340" cy="130" r="4" />
</svg>
